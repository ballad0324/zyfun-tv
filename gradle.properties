# 项目级 Gradle 配置
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin 编译守护进程偶发连不上时，强制在 Gradle 进程内编译（对齐 Box 工程经验）
kotlin.compiler.execution.strategy=in-process
